{% extends "base.html" %}
{% block content %}
<h1>Новый курс</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Название <input name="title" required></label>
  <label>Описание <textarea name="description" rows="4"></textarea></label>
  <label>Проходной балл <input type="number" name="passing_score" value="70" min="1" max="100"></label>
  <button type="submit">Создать черновик</button>
</form>
{% endblock %}
