{% extends "base.html" %}
{% block content %}
<p class="eyebrow">Методист</p>
<h1>Новый курс</h1>
<form method="post" class="card stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field">Название <input name="title" required></label>
  <label class="field">Описание <textarea name="description" rows="4"></textarea></label>
  <label class="field">Проходной балл <input type="number" name="passing_score" value="70" min="1" max="100"></label>
  <button type="submit" class="button-primary">Создать черновик</button>
</form>
{% endblock %}
