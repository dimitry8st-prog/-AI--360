{% extends "base.html" %}
{% block content %}
<p class="eyebrow">Руководитель</p>
<h1>Назначить программу</h1>
{% if users and courses %}
<form method="post" class="card stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field">Сотрудник
    <select name="user_id" required>
      {% for person in users %}
        <option value="{{ person.id }}">{{ person.full_name }} ({{ person.email }})</option>
      {% endfor %}
    </select>
  </label>
  <label class="field">Курс
    <select name="course_id" required>
      {% for course in courses %}
        <option value="{{ course.id }}">{{ course.title }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="field">Срок (необязательно) <input type="datetime-local" name="deadline"></label>
  <button type="submit" class="button-primary">Назначить</button>
</form>
{% else %}
  <p class="empty">Недостаточно данных для назначения: нужны сотрудники организации и опубликованный курс.</p>
{% endif %}
{% endblock %}
